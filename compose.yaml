services:
  app:
    build:
      context: .
    image: todo-app:local
    ports:
      - "${HOST_PORT:-3001}:3001"
    environment:
      PORT: 3001
      TODO_DB_PATH: /data/todos.db
    volumes:
      - todo-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  todo-data:
